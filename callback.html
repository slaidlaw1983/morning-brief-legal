<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Authorization callback — Morning Brief</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    max-width: 44rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 5rem;
    color: #1a1a1a;
    background: #fff;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  p.sub { color: #666; margin-top: 0; }
  .box { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem;
         margin: 1.5rem 0; }
  .err { border-color: #d33; }
  label { display: block; font-size: 0.8rem; text-transform: uppercase;
          letter-spacing: 0.05em; color: #666; margin-top: 0.9rem; }
  textarea {
    width: 100%; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular,
    Menlo, monospace; font-size: 0.85rem; padding: 0.5rem; border: 1px solid #ccc;
    border-radius: 4px; background: #fafafa; color: inherit; resize: vertical;
  }
  button { margin-top: 0.5rem; padding: 0.45rem 0.9rem; font-size: 0.9rem;
           border-radius: 5px; border: 1px solid #bbb; background: #f3f3f3;
           color: inherit; cursor: pointer; }
  button:hover { background: #e8e8e8; }
  footer { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid #e5e5e5;
           font-size: 0.85rem; color: #666; }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #121212; }
    p.sub, label, footer { color: #9a9a9a; }
    .box { border-color: #333; } footer { border-top-color: #2e2e2e; }
    textarea { background: #1c1c1c; border-color: #3a3a3a; }
    button { background: #262626; border-color: #444; }
    button:hover { background: #333; }
  }
</style>
</head>
<body>

<h1>Authorization callback</h1>
<p class="sub">Morning Brief · internal tool</p>

<div id="out"></div>

<footer>
  This page does not transmit or store anything. The values below come from your
  browser's address bar and stay in your browser.
  <a href="./index.html">Home</a>
</footer>

<script>
(function () {
  var out = document.getElementById('out');
  var q = new URLSearchParams(window.location.search);
  var err = q.get('error');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  if (err) {
    var desc = q.get('error_description') || '';
    out.innerHTML =
      '<div class="box err"><strong>Authorization was not completed.</strong>' +
      '<p>' + esc(err) + (desc ? ' — ' + esc(desc) : '') + '</p>' +
      '<p>Nothing was connected. You can close this tab and try again.</p></div>';
    return;
  }

  if (!q.get('code')) {
    out.innerHTML =
      '<div class="box"><p>No authorization parameters found in this URL.</p>' +
      '<p>This page is the OAuth redirect target for an internal tool. ' +
      'Reaching it directly does nothing.</p></div>';
    return;
  }

  out.innerHTML =
    '<div class="box"><strong>Authorization received.</strong>' +
    '<p>Copy the full URL below and paste it into the waiting ' +
    '<code>brief qbo-auth</code> prompt.</p>' +
    '<label for="full">Full callback URL</label>' +
    '<textarea id="full" rows="4" readonly></textarea>' +
    '<button id="copy" type="button">Copy to clipboard</button>' +
    '<label>realmId (company)</label>' +
    '<textarea rows="1" readonly>' + esc(q.get('realmId') || '(none)') + '</textarea>' +
    '</div>';

  var full = document.getElementById('full');
  full.value = window.location.href;

  document.getElementById('copy').addEventListener('click', function () {
    full.select();
    navigator.clipboard.writeText(full.value).then(function () {
      document.getElementById('copy').textContent = 'Copied';
    }, function () {
      document.getElementById('copy').textContent = 'Press Cmd+C';
    });
  });
})();
</script>

</body>
</html>
